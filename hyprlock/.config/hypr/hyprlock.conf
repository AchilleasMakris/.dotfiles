source = $HOME/dotfiles/hyprmocha/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = ~/.config/backgrounds/shaded.png
    blur_passes = 2
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 180
    font_family = $font
    position = -60, 0
    halign = right
    valign = top
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 50
    font_family = $font
    position = -60, -300
    halign = right
    valign = top
}

# USER AVATAR (commented out - no .face file)

# image {
#     monitor = 
#     path = ~/.face
#     size = 200
#     border_color = $accent
#
#     position = 0, 150
#     halign = center
#     valign = center
# }

# INPUT FIELD
input-field {
    monitor =
    size = 600, 120
    outline_thickness = 8
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4"><i>󰌾 Logged in as </i><span foreground="##cba6f7">$USER</span></span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -70
    halign = center
    valign = center
}
